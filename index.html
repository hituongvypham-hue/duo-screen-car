    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>CarPlay Multi-Screen Dashboard</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        height: 100% !important;
        height: 100dvh !important;
        width: 100% !important;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        overscroll-behavior: none !important;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: pan-x pan-y;
        background-color: #000;
      }
      #root {
        height: 100% !important;
        height: 100dvh !important;
        width: 100% !important;
        display: flex;
        flex-direction: column;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        box-sizing: border-box !important;
        overflow: hidden !important;
      }
      /* PWA Standalone mode on iPhone - ensure content is below Dynamic Island */
      @media all and (display-mode: standalone) {
        #root {
          padding-top: max(env(safe-area-inset-top, 0px), 54px) !important;
        }
      }
      /* Also handle iOS navigator.standalone */
      @supports (-webkit-touch-callout: none) {
        #root.pwa-standalone {
          padding-top: max(env(safe-area-inset-top, 0px), 54px) !important;
        }
      }
      .h-screen {
        height: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
      }
      .w-screen {
        width: 100% !important;
        max-width: 100% !important;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
      /* GPU layer isolation for iframes */
      iframe {
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: transform;
      }
      /* Map container: full GPU layer isolation + block browser touch handling */
      .map-layer-isolate {
        isolation: isolate !important;
        -webkit-transform: translate3d(0, 0, 0) !important;
        transform: translate3d(0, 0, 0) !important;
        -webkit-backface-visibility: hidden !important;
        backface-visibility: hidden !important;
        contain: paint layout !important;
        touch-action: none !important;
        -webkit-overflow-scrolling: auto !important;
      }
      /* Force iframe inside map container to have its own compositing layer */
      .map-layer-isolate iframe {
        will-change: transform !important;
        -webkit-transform: translate3d(0, 0, 0) !important;
        transform: translate3d(0, 0, 0) !important;
        -webkit-backface-visibility: hidden !important;
        backface-visibility: hidden !important;
        touch-action: auto !important;
      }
    </style>
    <script>
      // Ngăn Safari iOS phóng to thu nhỏ toàn trang gây chớp đen / rớt GPU layer trên iPhone
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      // Chặn multi-touch (2+ ngón) ở cấp document để tránh browser can thiệp vào iframe
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) {
          // Chỉ chặn nếu target KHÔNG phải iframe (để iframe xử lý nội bộ)
          var t = e.target;
          if (t && t.tagName !== 'IFRAME') {
            e.preventDefault();
          }
        }
      }, { passive: false });

      // Detect PWA standalone mode and add class to root
      if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) root.classList.add('pwa-standalone');
        });
      }
    </script>
